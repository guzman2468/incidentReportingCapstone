<!doctype html>
<html lang="en">
  <head>
    <!-- Page metadata -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account</title>

    <!-- Fonts (DM Sans + Space Grotesk) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Reuse the login styles for consistent look -->
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <div class="auth-page">
      <header class="auth-topbar">
        <div class="auth-brand">Incident Management Application</div>
      </header>

      <main class="auth-main">
        <section class="login-card">

        <h1>Create your account</h1>
        <p class="lead">Enter your details to create an account and start reporting incidents.</p>

        <form id="signupForm" novalidate>
          <!-- First name -->
          <label for="firstName">First name</label>
          <input id="firstName" name="firstName" type="text" required />
          <span class="field-error" id="firstNameError" role="alert"></span>
            
          <!-- Last name -->
          <label for="lastName">Last name</label>
          <input id="lastName" name="lastName" type="text" required />
          <span class="field-error" id="lastNameError" role="alert"></span>

          <!-- Email -->
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" title="Enter an email in the format name@domain.extension" />
          <span class="field-error" id="emailError" role="alert"></span>

          <!-- Password -->
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" required autocomplete="new-password" />
            <button class="password-toggle" type="button" data-password-target="password" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
            </button>
          </div>
          <span class="field-error" id="passwordError" role="alert"></span>

          <!-- Confirm password -->
          <label for="confirmPassword">Confirm password</label>
          <div class="password-field">
            <input id="confirmPassword" name="confirmPassword" type="password" required />
            <button class="password-toggle" type="button" data-password-target="confirmPassword" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
            </button>
          </div>
          <span class="field-error" id="confirmPasswordError" role="alert"></span>

          <button class="primary" type="submit">Create account</button>
        </form>

        <p class="signup">Already have an account? <a href="login.html">Sign in</a></p>
        </section>
      </main>
    </div>

    <script src="authHelpers.js"></script>
    <script src="signup.js"></script>
  </body>
</html>
