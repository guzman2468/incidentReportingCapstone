<!doctype html>
<html lang="en">
  <head>
    
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in</title>

    <!-- Fonts (DM Sans + Space Grotesk) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Local styles for the login page -->
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <div class="auth-page">
      <header class="auth-topbar">
        <div class="auth-brand">Incident Management Application</div>
      </header>

      <main class="auth-main">
        <section class="login-card">

        <!-- Heading and short description -->
        <h1>Sign in to your account</h1>
        <p class="lead">Reporters can create an account below. All other roles should sign in with their provisioned credentials.</p>

        <!-- Login form: keeps markup semantic and accessible -->
        <form id="loginForm" novalidate>

          <!-- Email field -->
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" title="Enter an email in the format name@domain.extension" />
          <span class="field-error" id="emailError" role="alert"></span>

          <!-- Password field -->
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" required autocomplete="current-password" />
            <button class="password-toggle" type="button" data-password-target="password" aria-label="Show password" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
            </button>
          </div>
          <span class="field-error" id="passwordError" role="alert"></span>

          <!-- Row with remember checkbox and forgot link -->
          <div class="row between small">
            <label class="remember">
              <input type="checkbox" id="remember" />
              Remember me
            </label>

            <a class="muted" href="#">Forgot password?</a>
          </div>

          <!-- Primary action -->
          <button class="primary" type="submit">Sign in</button>
        </form>

        <!-- Secondary action: create an account -->
        <p class="signup">New reporter? <a href="signup.html">Create an account</a></p>

        </section>
      </main>
    </div>

    <script src="authHelpers.js"></script>
    <script src="login.js"></script>
  </body>
</html>
