<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Change your password</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="auth-page">
      <header class="auth-topbar auth-topbar-user">
        <div class="auth-brand">Incident Management Application</div>
        <div class="user-menu" hidden>
          <button
            type="button"
            class="top-avatar"
            id="userButton"
            data-user-initials
            aria-label="Open user menu"
            aria-expanded="false"
          ></button>
          <div class="user-dropdown" id="userDropdown" aria-hidden="true">
            <div class="user-summary">
              <strong data-user-name></strong>
              <span data-user-role></span>
            </div>
            <button type="button" id="logoutButton">
              ↪ <span>Log out</span>
            </button>
          </div>
        </div>
      </header>
      <main class="auth-main">
        <section class="login-card">
          <h1>Change your password</h1>
          <p class="lead">
            For security, choose a new password before continuing.
          </p>
          <form id="changePasswordForm" novalidate>
            <label for="currentPassword">Old password</label>
            <div class="password-field">
              <input
                id="currentPassword"
                type="password"
                required
                autocomplete="current-password"
              />
              <button
                class="password-toggle"
                type="button"
                data-password-target="currentPassword"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                  ></path>
                  <circle cx="12" cy="12" r="2.5"></circle>
                </svg>
              </button>
            </div>
            <span
              class="field-error"
              id="currentPasswordError"
              role="alert"
            ></span>
            <label for="newPassword">New password</label>
            <div class="password-field">
              <input
                id="newPassword"
                type="password"
                required
                minlength="8"
                autocomplete="new-password"
              />
              <button
                class="password-toggle"
                type="button"
                data-password-target="newPassword"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                  ></path>
                  <circle cx="12" cy="12" r="2.5"></circle>
                </svg>
              </button>
            </div>
            <span class="field-error" id="newPasswordError" role="alert"></span>
            <label for="confirmPassword">Confirm new password</label>
            <div class="password-field">
              <input
                id="confirmPassword"
                type="password"
                required
                autocomplete="new-password"
              />
              <button
                class="password-toggle"
                type="button"
                data-password-target="confirmPassword"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                  ></path>
                  <circle cx="12" cy="12" r="2.5"></circle>
                </svg>
              </button>
            </div>
            <span
              class="field-error"
              id="confirmPasswordError"
              role="alert"
            ></span>
            <button class="primary" type="submit">Change password</button>
            <button
              class="secondary-button"
              type="button"
              id="cancelPasswordChangeButton"
              hidden
            >
              Cancel
            </button>
          </form>
          <output
            class="success-message"
            id="changePasswordSuccess"
            aria-live="polite"
          ></output>
        </section>
      </main>
    </div>
    <script src="authHelpers.js"></script>
    <script src="changePassword.js"></script>
  </body>
</html>
